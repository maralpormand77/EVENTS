name: Auto Sync Personnel Database from Excel

on:
  push:
    paths:
      - '*.xlsx'
      - 'convert_excel.py'
      - '.github/workflows/auto-update-excel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-excel:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install openpyxl

      - name: Convert Excel to JavaScript Database
        run: |
          python convert_excel.py

      - name: Commit and Push Changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/js/personnel-data.js 1/assets/js/personnel-data.js 2/assets/js/personnel-data.js 3/assets/js/personnel-data.js admin/assets/js/personnel-data.js
          if ! git diff --cached --quiet; then
            git commit -m "Auto-sync personnel database from Excel [skip ci]"
            git push
            echo "Personnel data updated and pushed to repository successfully."
          else
            echo "No changes detected in personnel database."
          fi
